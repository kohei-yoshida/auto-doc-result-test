name: Revise documentation from review
on:
  pull_request_review_comment:
    types: [created]
permissions:
  contents: write
  issues: read
  pull-requests: read
concurrency:
  group: docs-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  revise:
    if: startsWith(github.event.pull_request.head.ref, 'auto-doc/') && github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Revise the same Docs PR branch
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/revise_docs.py
